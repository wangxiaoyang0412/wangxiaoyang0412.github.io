name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Collect Google Scholar data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: vGh4WZEAAAAJ
        run: |
          python -m pip install --requirement requirements.txt
          python main.py
      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add *.json
          git commit -m "Update Google Scholar citation data"
          git push origin HEAD:google-scholar-stats --force
