<section class="visitor-map" id="visitor-map" aria-labelledby="visitor-map-title">
  <h2 class="visitor-map__heading" id="visitor-map-title">Visitor Map</h2>

  <div class="visitor-map__body">
    <div class="visitor-map__visual">
      <a class="visitor-map__map" href="https://mapmyvisitors.com/web/1c0rl" aria-label="Open the live visitor dashboard">
        <img
          src="https://mapmyvisitors.com/map.png?cl=315b7d&w=420&t=n&d=VwnZlP0yX7sO015IomJBlgADuuGHtL83o_f0LsUttyQ&co=f4f7fb&ct=23395d"
          alt="World map showing approximate visitor locations"
          width="420"
          height="206"
          loading="lazy"
          fetchpriority="low"
          decoding="async"
          referrerpolicy="strict-origin-when-cross-origin"
        />
      </a>
    </div>

    <div class="visitor-map__content">
      <h3>Hello, world! <span aria-hidden="true">🌍</span></h3>
      <p class="visitor-map__welcome">
        Thanks for visiting. I am open to collaborations on trustworthy AI for healthcare, multimodal learning, and multi-agent systems. Feel free to get in touch.
      </p>
      <ul class="visitor-map__meta">
        <li>
          <i class="fas fa-fw fa-university" aria-hidden="true"></i>
          <a href="https://drexel.edu/">Drexel University</a>, Philadelphia, PA
        </li>
        <li>
          <i class="fas fa-fw fa-envelope" aria-hidden="true"></i>
          <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        </li>
        <li>
          <i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i>
          Locations via <a href="https://mapmyvisitors.com/web/1c0rl">MapMyVisitors</a>
          <span aria-hidden="true">·</span>
          <a href="https://mapmyvisitors.com/b/policy">Privacy</a>
        </li>
      </ul>
    </div>
  </div>
</section>
